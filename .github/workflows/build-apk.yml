name: Android CI/CD • Build, Test & Deploy

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_to_play_store:
        description: 'Desplegar a Google Play Internal Testing tras compilar'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # Job 1: Unit Tests
  # =========================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Run Debug Unit Tests
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  # =========================================================================
  # Job 2: Static Analysis & Android Lint
  # =========================================================================
  lint:
    name: Android Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Run Android Lint
        working-directory: ./android
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          retention-days: 14

  # =========================================================================
  # Job 3: Build & Sign Release APK & AAB
  # =========================================================================
  build:
    name: Build Release Artifacts (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Compile Vulkan Compute Shaders (GLSL to SPIR-V)
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          mkdir -p android/app/src/main/assets/shaders
          for shader in android/app/src/main/shaders/*.comp; do
            if [ -f "$shader" ]; then
              glslangValidator -V "$shader" -o "android/app/src/main/assets/shaders/$(basename "$shader").spv"
            fi
          done

      - name: Decode Release Keystore from Secrets
        id: decode_keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.keystore
          echo "KEYSTORE_PROVISIONED=true" >> $GITHUB_ENV
          echo "KEYSTORE_FILE=$(pwd)/android/app/keystore/release.keystore" >> $GITHUB_ENV

      - name: Build Debug & Release APK & App Bundle (AAB)
        working-directory: ./android
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Shred & Clean Temporary Keystore
        if: always()
        run: |
          if [ -f "android/app/keystore/release.keystore" ]; then
            shred -u android/app/keystore/release.keystore || rm -f android/app/keystore/release.keystore
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload ProGuard / R8 Mapping & Metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols-and-metadata
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/apk/release/output-metadata.json
          retention-days: 30

  # =========================================================================
  # Job 4: Deploy to Google Play Store (Internal Testing)
  # =========================================================================
  deploy-play-store:
    name: Deploy to Google Play Internal Testing
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_to_play_store == 'true') &&
      secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: app-bundle/

      - name: Deploy to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.photoengine.core
          releaseFiles: app-bundle/*.aab
          track: internal
          status: completed
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
