name: Android Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK with NDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses and Install NDK & CMake
        run: |
          echo "=== Setting up Android SDK, NDK and CMake ==="
          SDKMANAGER_BIN="sdkmanager"
          if ! command -v sdkmanager &> /dev/null; then
            SDKMANAGER_BIN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          
          echo "Accepting Android SDK licenses..."
          yes | $SDKMANAGER_BIN --licenses || true
          
          echo "Installing exact NDK 26.3.11579264 and CMake 3.22.1..."
          $SDKMANAGER_BIN --install "ndk;26.3.11579264" "cmake;3.22.1"
          
          echo "Verifying NDK installation..."
          ls -la "$ANDROID_HOME/ndk/26.3.11579264" || true
          
          echo "Exporting environment variables..."
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew android/gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Compile Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Diagnostics on Failure
        if: failure()
        run: |
          echo "=== Compilation failed. Running diagnostics ==="
          find . -maxdepth 5 -type f | sort
          find $ANDROID_HOME -maxdepth 4 -type d | grep -i ndk || true

      - name: Locate and verify generated APK
        run: |
          echo "=== Locating generated APK ==="
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ] && [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p app/build/outputs/apk/debug
            cp android/app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
          fi

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Successfully verified APK at app/build/outputs/apk/debug/app-debug.apk"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "::error::APK was not found at app/build/outputs/apk/debug/app-debug.apk"
            echo "Running diagnostics..."
            find . -maxdepth 5 -type f | sort
            find $ANDROID_HOME -maxdepth 4 -type d | grep -i ndk || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
